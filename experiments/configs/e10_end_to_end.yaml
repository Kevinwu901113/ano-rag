include:
  - ../manifests/datasets.yaml
  - ../manifests/methods.yaml

exp:
  name: e10_end_to_end
  goal: "End-to-end evaluation with full pipeline"
  llm_profile: default

llm_profiles:
  - name: default
    model: qwen3-30b-a3b
    endpoint: http://127.0.0.1:8000/v1

datasets:
  - hotpotqa_distractor_200

methods:
  - relrag_full
  - hybrid_rag

budgets:
  token_budgets: [2000]

embedding:
  model: BAAI/bge-small-en-v1.5

runtime:
  limit: 20
  workers: 1
  save_every: 10
  run_eval: true

decode:
  temperature: 0.0
  max_tokens: 200

topk:
  retrieve_k: 10
  gen_k: 5
