meta:
  project: relrag
  result_root: result_relrag
  timezone: Asia/Singapore

runtime:
  workers: 1
  resume: false
  save_every: 20
  run_eval: true
  seed: 42

llm:
  endpoint: "http://127.0.0.1:8000/v1"
  model: "qwen3-30b-a3b"
  no_proxy: true

embedding:
  model: "/home/wjk/models/qwen3-emb"
  device: "cpu"
  batch_size: 16
  max_length: 512
  normalize: true
  dtype: null

budgets:
  token_budgets: [4096, 8192, 16384]

fairness:
  enforce_budget: true
  enforce_topk: true
  require_prompt_hash: false

decode:
  temperature: 0.0
  top_p: null
  repetition_penalty: null
  max_tokens: 128

topk:
  retrieve_k: [1, 3, 5, 10]
  gen_k: 10

answer_format:
  mode: "short_answer"
  forbid_think_tags: true
  min_answer_chars: 1
