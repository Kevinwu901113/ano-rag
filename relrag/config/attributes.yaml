attributes:
  occupation:
    description: >
      Occupation/职业类问题，仅接受定义型（is/was）或同位语型证据。值必须是职业名词，且来源可追溯到
      定义句（非叙事活动）。
    definition_patterns:
      - "\\b(?:is|was|has been|serves as|served as|worked as|is best known as)\\b\\s+(?:an?|the)?\\s*[A-Za-z][^.,;]+"
    appositive_patterns:
      - ",\\s*(?:an?|the)\\s+[A-Za-z][^,]+,"
