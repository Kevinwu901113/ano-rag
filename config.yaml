system:
  project_name: "ano-rag"
  device: "cuda"

chunk:
  n_sent: 3
  overlap: 1
  max_tokens: 768

vllm:
  endpoint: "http://127.0.0.1:8000/v1"
  model: "qwen3-30b-a3b"
  temperature: 0.0
  max_new_tokens: 256
  concurrency:
    max_workers: 16
    connect_timeout_sec: 3.05
    read_timeout_sec: 20.0
    retry_max_attempts: 2
    retry_total_cap_sec: 30.0
    retry_backoff_base: 1.0
    retry_backoff_max_sec: 6.0
    retry_jitter_frac: 0.5
    pause_on_timeout_rate: 0.3
    pause_sec: 7.0
    buckets:
      "0_256": { workers: 8 }
      "256_512": { workers: 6 }
      "512_1024": { workers: 4 }
      "1024_plus": { workers: 2 }
    refill_factor: 1.5
  adaptive:
    enabled: false
    min_workers: 4
    max_workers: 32
    target_p50_ms: 1200
    target_p95_ms: 3500
    step_up: 2
    step_down: 2
    window_size: 50
    cool_down_sec: 5.0

routing:
  token_budget_hint: 320000

llm_profiles:
  extract:
    temperature: 0.0
    max_tokens: 256
    thinking: false
  generate:
    temperature: 0.2
    max_tokens: 128
    thinking: null

structrag:
  router: "llm"
  supported_types: ["chunk", "graph"]
  top_k: 10
  llm_model: "qwen3-30b-a3b"

relrag:
  dataset: "hotpotqa"
  top_k: 20
  max_context_tokens: 4096

retriever:
  structured:
    enabled: true
    fanout: 8
    entity_match_threshold: 0.5
    path_consistency_threshold: 0.9
    vector_fallback_enabled: false
  simple_raptor:
    # 每个 summary node 最多挂多少叶子 chunk（默认20太小）
    max_descendants: 128

    # 检索阶段，召回多少个树节点
    top_k_nodes: 20

    # 最终给 LLM 的 chunk 数量（默认5太少）
    max_answer_chunks: 16

    # 是否开启“名字感知”rerank
    enable_name_rerank: true
  embedding:
    enabled: true
    provider: "st"
    model: "sentence-transformers/all-MiniLM-L6-v2"
    model_path_override: null
    cache_dir: "/home/wjk/models/hf-cache"
    download_dir: null
    device: "cpu"
    dtype: "float32"
    auto_build: true
    offline_index_path: "indexes/faiss/notes.faiss"
    meta_path: "indexes/faiss/notes.meta.parquet"
    max_len_note: 256
    topn: 200
    faiss:
      kind: "HNSW32"
      nprobe: 16
      efSearch: 128
    normalize: true
  bm25:
    enabled: true
    backend: "pyserini"
    store_path: "indexes/bm25/notes"
    k1: 0.9
    b: 0.4
    ngram: [1, 2]
    field_weights: {subj: 2.0, pred: 1.6, obj: 1.2, ctx: 1.0}
    topn: 200
  fusion:
    method: "rrf"
    rrf_k: 60
    weights: {struct: 0.4, emb: 0.35, bm25: 0.25}
    pre_topM: 128
    final_topK: 64
  hybrid:
    agreement_threshold: 2
    weights:
      bm25: 1.0
      embedding: 1.0
      structured: 1.5
      subject_match: 2.0
      source_agree: 1.0

reranker:
  enabled: true
  type: "llm"
  llm:
    endpoint: "${vllm.endpoint}"
    model: "${vllm.model}"
    batch: 16
    timeout_s: 60
  final_weights: {pre: 0.3, rerank: 0.5, struct: 0.2}

notes:
  out_path: "notes/notes.jsonl"
  indexes_dir: "indexes/"

parsing:
  allow_jsonl: true
  enable_array_packer: true
  enable_bare_key_fix: true
  enable_loose_extractor: true
  loose_split_key: "subj"
  max_tokens: 768
  parse_retry: 1
  stop:
    - "]\n"
    - "\n]"
    - "\n\nEND"
    - "END_JSON"
    - "\n\n"

schema_guard:
  min_evidence_len: 4
  max_evidence_len: 512
  type_map:
    GROUP: ORG
    OBJECT: CONCEPT
    NUMBER: CONCEPT
    QUANTITY: CONCEPT
    PERCENT: CONCEPT
    DATE: TIME
    YEAR: TIME
