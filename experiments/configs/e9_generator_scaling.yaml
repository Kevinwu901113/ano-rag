include:
  - ../manifests/datasets.yaml
  - ../manifests/methods.yaml

exp:
  name: e9_generator_scaling
  goal: "Evaluate performance across different generator sizes"
  llm_profile: default

llm_profiles:
  - name: default
    model: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    endpoint: ${LLM_ENDPOINT:-http://localhost:8000/v1}
  - name: small
    model: ${LLM_MODEL_SMALL:-Qwen/Qwen2.5-1.5B-Instruct}
    endpoint: ${LLM_ENDPOINT:-http://localhost:8000/v1}
  - name: large
    model: ${LLM_MODEL_LARGE:-Qwen/Qwen2.5-14B-Instruct}
    endpoint: ${LLM_ENDPOINT:-http://localhost:8000/v1}

datasets:
  - hotpotqa_distractor_200

methods:
  - relrag_full

budgets:
  token_budgets: [2000]

embedding:
  model: BAAI/bge-small-en-v1.5

runtime:
  limit: 20
  workers: 1
  save_every: 10
  run_eval: true

decode:
  temperature: 0.0
  max_tokens: 200

topk:
  retrieve_k: 5
  gen_k: 5
